name: Report deploy

# The test catalog has no Pages site. This builds the catalog the way
# deploy.yml does, sends the developer portal staging site the same report, so
# changes merged here move to "live" there, and the catalog files, which the
# portal serves at plugins-staging.nginxui.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: report-deploy
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/checkout@v7
        with:
          repository: nginxui/plugin-spec
          path: .plugin-spec
          persist-credentials: false

      - name: Build the catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_URL: ${{ vars.CATALOG_URL }}
          PLUGIN_SPEC_DIR: ${{ github.workspace }}/.plugin-spec
          # Screenshots uploaded in the portal staging site.
          MEDIA_URL: ${{ vars.MEDIA_URL }}
        run: node scripts/build-catalog.mjs --out dist --pending pending-names.json

      - name: Publish the catalog files
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: node scripts/ci/publish-staging-site.mjs dist

      - name: Report to the developer portal
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: node scripts/ci/report-deploy.mjs

      # The whole build, site pages included, is kept to look at.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site
          path: dist
          retention-days: 7
